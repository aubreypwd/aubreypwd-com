name: Deploy

on:
  push:
    tags:
      - '*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Update Remote
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            git -C /home/${{secrets.SSH_USER}}/aubreypwd.com/wp-content reset --hard origin/main
            git -C /home/${{secrets.SSH_USER}}/aubreypwd.com/wp-content clean -df
            git -C /home/${{secrets.SSH_USER}}/aubreypwd.com/wp-content pull origin main
            wp --path=/home/${{secrets.SSH_USER}}/aubreypwd.com/ plugin update --all --yes
            wp --path=/home/${{secrets.SSH_USER}}/aubreypwd.com/ core update --yes
            wp --path=/home/${{secrets.SSH_USER}}/aubreypwd.com/ core update-db --yes
