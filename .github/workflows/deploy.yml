name: Deploy

on:
  push:
    tags:
      - '*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # From wp-content/ #

      - name: Upload db.php
        uses: airvzxf/ftp-deployment-action@latest
        with:
          server: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASS }}
          local_dir: .
          remote_dir: .
          delete: false # Just upload db.php

      - name: Upload mu-plugins/
        uses: airvzxf/ftp-deployment-action@latest
        with:
          server: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASS }}
          local_dir: ./mu-plugins
          remote_dir: ./mu-plugins
          delete: true

      - name: Upload plugins/
        uses: airvzxf/ftp-deployment-action@latest
        with:
          server: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASS }}
          local_dir: ./plugins
          remote_dir: ./plugins
          delete: true

      - name: Upload themes/
        uses: airvzxf/ftp-deployment-action@latest
        with:
          server: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASS }}
          local_dir: ./themes
          remote_dir: ./themes
          delete: true