name: Deploy

on:
  push:
    tags:
      - '*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Update Remote
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            git -C /home/aubrtdyz/aubreypwd.com/wp-content reset --hard origin/main
            git -C /home/aubrtdyz/aubreypwd.com/wp-content clean -df
            git -C /home/aubrtdyz/aubreypwd.com/wp-content pull origin main
