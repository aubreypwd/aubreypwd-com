name: Deploy
on:
  push:
    tags:
      - '*'
jobs:
  - name: "Checkout"
    uses: actions/checkout@v4
    with:
      fetch-depth: 0
  - name: "Deploy"
    uses: milanmk/actions-file-deployer@master
    with:
      remote-protocol: "ftp"
      remote-host: ${{ secrets.DEPLOY_HOST }}
      remote-port: ${{ secrets.DEPLOY_PORT }}
      remote-user: ${{ secrets.DEPLOY_USER }}
      local-path: "./"
      remote-path: "./"
      sync: full
      debug: true
      sync-delta-excludes:
        - .git*
        - .git/**
        - .github/**
        - .ftp*
        - index.php
        - uploads/**
        - database/**