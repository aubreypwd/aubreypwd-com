name: Deploy

on:
  push:
    tags:
      - '*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy
        uses: milanmk/actions-file-deployer@master
        with:
          remote-protocol: "ftp"
          remote-host: ${{ secrets.DEPLOY_HOST }}
          remote-port: ${{ secrets.DEPLOY_PORT }}
          remote-user: ${{ secrets.DEPLOY_USER }}
          remote-password: ${{ secrets.DEPLOY_PASS }}
          local-path: "./"
          remote-path: "./"
          sync: full
          debug: false
          sync-delta-excludes: |
            .git*
            .git/**
            .github/**
            .ftp*
            index.php
            uploads/**
            database/**